<!doctype html>
<meta charset="utf-8">
<style>
@font-face{font-family:SF;src:url("file:///System/Library/Fonts/SFNS.ttf");font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;background:#f2f2f7;font-family:SF,-apple-system,sans-serif}
body{width:1080px;height:1350px}
.stage{height:100%;padding:64px;display:flex;flex-direction:column;align-items:center;gap:40px}
.title{margin:0;width:100%;font-size:64px;line-height:1.08;font-weight:700;letter-spacing:-.015em;color:#15151a}
.phone{flex:none;overflow:hidden;background:#f2f2f7;box-shadow:0 20px 48px #20263a24}
.phone img{display:block;width:100%;height:100%;object-fit:contain}
.clean .title{display:none}
.clean{justify-content:center}
</style>
<main class="stage"><h1 class="title"></h1><div class="phone"><img alt="MACROS full iPhone screen"></div></main>
<script>
const q=new URLSearchParams(location.search);
const height=Number(q.get("height")||1350),kind=q.get("kind")||"clean",screen=q.get("screen")||"home";
document.body.style.height=height+"px";
document.querySelector(".stage").classList.add(kind);
document.querySelector(".title").innerHTML=screen==="home"?"Log your food.<br>Get on with your day.":"Your month, at a glance.";
const titleHeight=kind==="clean"?0:(screen==="home"?138.24:69.12)+40;
const h=height-128-titleHeight,w=h*1320/2868;
Object.assign(document.querySelector(".phone").style,{width:w+"px",height:h+"px",borderRadius:w*.09+"px"});
document.querySelector("img").src=screen+".png";
</script>
